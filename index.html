<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SilentShadow Portfolio | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="brand-panel">
        <div class="brand-badge">SS</div>
        <p class="eyebrow">Portfolio Dashboard</p>
        <h1>Welcome back.</h1>
        <p class="intro">
          Access your dashboard, project updates, and portfolio management tools.
        </p>
      </section>

      <section class="form-panel">
        <div class="form-card">
          <p class="card-kicker">Sign in</p>
          <h2>Manage your portfolio</h2>

          <form id="loginForm" novalidate>
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" />

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" />

            <div class="utility-row">
              <label class="checkbox-wrap">
                <input type="checkbox" id="rememberMe" />
                <span>Remember me</span>
              </label>
              <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="primary-btn">Sign in</button>
            <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
